<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>snap.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* dynamic viewport height (dvh) rešava bagove na mobilnim pretraživačima */
        body { 
            background-color: #0d0d0d; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: 100dvh; 
            justify-content: space-between; 
            align-items: center; 
            padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px) 16px; 
            overflow: hidden; 
        }
        
        /* Header */
        header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .logo { font-size: 22px; font-weight: 500; letter-spacing: -0.5px; opacity: 0.9; }
        .logo span { font-weight: 300; opacity: 0.5; }

        /* Filter Switcher */
        .filter-switcher { display: flex; background: rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 3px; gap: 4px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .filter-btn { background: transparent; border: none; color: rgba(255, 255, 255, 0.4); padding: 5px 14px; font-size: 11px; font-weight: 500; border-radius: 16px; cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s ease; }
        .filter-btn.active { background: rgba(255, 255, 255, 0.2); color: #fff; }

        /* Viewport kamere za sve ekrane */
        .viewport { 
            position: relative; 
            width: 100%; 
            max-width: 380px; 
            max-height: 58dvh; 
            aspect-ratio: 3/4; 
            background: #000; 
            border-radius: 28px; 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            margin: auto 0; 
        }
        
        video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s ease, transform 0.3s ease; }
        video.vintage { filter: sepia(0.2) contrast(1.1) saturate(1.15); }
        video.original { filter: none; }
        video.mirror { transform: scaleX(-1); } /* Zrcaljenje za selfie kameru */

        canvas { display: none; }

        /* Flash efekat */
        .flash { position: absolute; top:0; left:0; width:100%; height:100%; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.15s ease-out; z-index: 10; }
        .flash.active { opacity: 0.85; }

        /* Bedževi unutar kamere */
        .counter-badge { position: absolute; top: 14px; right: 14px; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 5px 11px; border-radius: 20px; font-size: 11px; font-weight: 500; letter-spacing: 0.8px; border: 1px solid rgba(255,255,255,0.1); z-index: 5; }
        
        /* Dugme za prebacivanje kamere (Flip) */
        .flip-btn { position: absolute; bottom: 14px; right: 14px; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; z-index: 5; transition: transform 0.2s ease; }
        .flip-btn:active { transform: scale(0.88) rotate(180deg); }
        .flip-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Kontrole na dnu */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; margin-bottom: 6px; }
        
        .shutter-outer { width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; transition: transform 0.2s cubic-bezier(0.1, 0, 0, 1); outline: none; }
        .shutter-inner { width: 58px; height: 58px; border-radius: 50%; background: #ffffff; transition: transform 0.15s ease, background 0.3s; }
        
        .shutter-outer:active { transform: scale(0.92); }
        .shutter-outer:disabled { border-color: rgba(255, 255, 255, 0.15); cursor: not-allowed; }
        .shutter-outer:disabled .shutter-inner { background: rgba(255, 255, 255, 0.15); }

        .status-text { font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.5); letter-spacing: 0.2px; height: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">snap<span>.me</span></div>
        <div class="filter-switcher">
            <button class="filter-btn active" id="btn-vintage" onclick="setFilter('vintage')">VINTAGE</button>
            <button class="filter-btn" id="btn-original" onclick="setFilter('original')">ORIGINAL</button>
        </div>
    </header>

    <div class="viewport">
        <video id="webcam" class="vintage" autoplay playsinline></video>
        <div class="flash" id="flash"></div>
        <div class="counter-badge" id="counter">5 LEFT</div>
        <button class="flip-btn" onclick="toggleCamera()" title="Prebaci kameru">
            <svg viewBox="0 0 24 24">
                <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8e0 1.281.305 2.415.842 3.415M4 14c0 4.418 3.582 8 8 8s8-3.582 8-8e0-1.281-.305-2.415-.842-3.415"/>
                <polyline points="9 11 4 14 4 8"/>
                <polyline points="15 13 20 10 20 16"/>
            </svg>
        </button>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button class="shutter-outer" id="snap-btn" onclick="takePhoto()">
            <div class="shutter-inner"></div>
        </button>
        <div class="status-text" id="status-text">Ready</div>
    </div>

    <script>
        // *** UNESI SVOJ GOOGLE SCRIPT URL OVDE ***
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMcvNwmd4g9H6tT8LMBjIsxuN6iY0A2iJRd7sPl_hplsI8gw2HTSg6PQaNwTTjokdP/exec"; 
        
        const MAX_PHOTOS = 5;
        let photosLeft = localStorage.getItem('snap_me_photos') !== null ? parseInt(localStorage.getItem('snap_me_photos')) : MAX_PHOTOS;
        let currentFilter = 'vintage';
        let currentFacingMode = 'environment'; // Zadnja kamera po defaultu
        let currentStream = null;
        
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const snapBtn = document.getElementById('snap-btn');
        const counterEl = document.getElementById('counter');
        const statusEl = document.getElementById('status-text');
        const flashEl = document.getElementById('flash');

        function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: currentFacingMode }, 
                audio: false 
            })
            .then(stream => { 
                currentStream = stream;
                video.srcObject = stream; 
                if (currentFacingMode === 'user') {
                    video.classList.add('mirror');
                } else {
                    video.classList.remove('mirror');
                }
            })
            .catch(err => { 
                statusEl.innerText = "Camera access denied."; 
            });
        }

        function toggleCamera() {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            startCamera();
        }

        function setFilter(mode) {
            currentFilter = mode;
            if(mode === 'vintage') {
                video.classList.add('vintage');
                video.classList.remove('original');
                document.getElementById('btn-vintage').classList.add('active');
                document.getElementById('btn-original').classList.remove('active');
            } else {
                video.classList.add('original');
                video.classList.remove('vintage');
                document.getElementById('btn-original').classList.add('active');
                document.getElementById('btn-vintage').classList.remove('active');
            }
        }

        function updateUI() {
            counterEl.innerText = `${photosLeft} LEFT`;
            if (photosLeft <= 0) {
                snapBtn.disabled = true;
                counterEl.innerText = "0 LEFT";
                statusEl.innerText = "Camera locked for tonight.";
            }
        }

        function triggerFlash() {
            flashEl.classList.add('active');
            setTimeout(() => { flashEl.classList.remove('active'); }, 150);
        }

        function takePhoto() {
            if (photosLeft <= 0) return;

            triggerFlash();
            snapBtn.disabled = true;
            statusEl.innerText = "Developing...";

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            // Ako je prednja kamera, moramo i sliku na canvasu okrenuti da ne bude izavrgnuta
            if (currentFacingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Vraćanje transformacije pre dodavanja datuma i filtera
            if (currentFacingMode === 'user') {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }

            // Vintage Sepia/Film obrada
            if (currentFilter === 'vintage') {
                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    data[i]     = (r * 0.393) + (g * 0.769) + (b * 0.189) + 20;
                    data[i+1]   = (r * 0.349) + (g * 0.686) + (b * 0.168);
                    data[i+2]   = (r * 0.272) + (g * 0.534) + (b * 0.131);
                }
                ctx.putImageData(imageData, 0, 0);
            }

            // Narandžasti retro datum
            const d = new Date();
            const dateStr = `'${String(d.getFullYear()).slice(-2)} ${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getDate()).padStart(2,'0')}`;
            ctx.font = "500 20px 'Inter', monospace";
            ctx.fillStyle = "#ff8c00";
            ctx.shadowColor = "rgba(0,0,0,0.6)";
            ctx.shadowBlur = 4;
            ctx.fillText(dateStr, canvas.width - 130, canvas.height - 24);

            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ base64: base64Image })
            }).then(() => {
                photosLeft--;
                localStorage.setItem('snap_me_photos', photosLeft);
                updateUI();
                if(photosLeft > 0) {
                    statusEl.innerText = "Saved to album";
                    snapBtn.disabled = false;
                    setTimeout(() => { statusEl.innerText = "Ready"; }, 2000);
                }
            }).catch(err => {
                statusEl.innerText = "Error. Try again.";
                snapBtn.disabled = false;
            });
        }

        // Pokretanje
        startCamera();
        updateUI();
    </script>
</body>
</html>
