<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>snap.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; align-items: center; padding: 24px 16px; overflow: hidden; }
        
        /* Header - ultra sveden */
        header { text-align: center; margin-top: 10px; opacity: 0.9; }
        .logo { font-size: 20px; font-weight: 500; letter-spacing: -0.5px; opacity: 0.9; }
        .logo span { font-weight: 500; opacity: 0.5; }
        .sub-text { font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.4; margin-top: 4px; }

        /* Kontejner kamere sa stilom stakla */
        .viewport { position: relative; width: 100%; max-width: 380px; aspect-ratio: 3/4; background: #000; border-radius: 32px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.6); margin: auto 0; }
        
        video { width: 100%; height: 100%; object-fit: cover; filter: sepia(0.2) contrast(1.1) saturate(1.15); }
        canvas { display: none; }

        /* Flash efekat na okidač */
        .flash { position: absolute; top:0; left:0; width:100%; height:100%; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.15s ease-out; z-index: 10; }
        .flash.active { opacity: 0.85; }

        /* Badge sa brojačem unutar viewport-a */
        .counter-badge { position: absolute; top: 16px; right: 16px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; letter-spacing: 1px; border: 1px solid rgba(255,255,255,0.1); }

        /* Kontrole na dnu - Once Style Shutter */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 10px; width: 100%; }
        
        .shutter-outer { width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); display: flex; align-items: center; justify-content: center; background: transparent; cursor: pointer; transition: transform 0.2s cubic-bezier(0.1, 0, 0, 1), border-color 0.3s; outline: none; }
        .shutter-inner { width: 62px; height: 62px; border-radius: 50%; background: #ffffff; transition: transform 0.15s ease, background 0.3s; }
        
        .shutter-outer:active { transform: scale(0.92); }
        .shutter-outer:disabled { border-color: rgba(255, 255, 255, 0.15); cursor: not-allowed; }
        .shutter-outer:disabled .shutter-inner { background: rgba(255, 255, 255, 0.15); }

        /* Status poruka */
        .status-text { font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.5); letter-spacing: 0.2px; height: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">snepni<span>.me</span></div>
        <div class="sub-text">Digital Disposable</div>
    </header>

    <div class="viewport">
        <video id="webcam" autoplay playsinline></video>
        <div class="flash" id="flash"></div>
        <div class="counter-badge" id="counter">5 LEFT</div>
        <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
        <button class="shutter-outer" id="snap-btn" onclick="takePhoto()">
            <div class="shutter-inner"></div>
        </button>
        <div class="status-text" id="status-text">Ready</div>
    </div>

    <script>
        // *** UNESI SVOJ GOOGLE SCRIPT URL OVDE ***
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/u/2/s/AKfycbw0LyhtdCxUMDjr3tqWLh2uraq_UdcmZgrsxT-2RRsTcx0csa5bnw3h1mnYm-ozAVq1BA/exec"; 
        
        const MAX_PHOTOS = 5;
        let photosLeft = localStorage.getItem('snap_me_photos') !== null ? parseInt(localStorage.getItem('snap_me_photos')) : MAX_PHOTOS;
        
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const snapBtn = document.getElementById('snap-btn');
        const counterEl = document.getElementById('counter');
        const statusEl = document.getElementById('status-text');
        const flashEl = document.getElementById('flash');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { 
                statusEl.innerText = "Camera access denied."; 
            });

        function updateUI() {
            counterEl.innerText = `${photosLeft} LEFT`;
            if (photosLeft <= 0) {
                snapBtn.disabled = true;
                counterEl.innerText = "0 LEFT";
                statusEl.innerText = "Camera locked for tonight.";
            }
        }
        updateUI();

        function triggerFlash() {
            flashEl.classList.add('active');
            setTimeout(() => { flashEl.classList.remove('active'); }, 150);
        }

        function takePhoto() {
            if (photosLeft <= 0) return;

            triggerFlash();
            snapBtn.disabled = true;
            statusEl.innerText = "Developing...";

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Vintage Sepia/Film obrada
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                data[i]     = (r * 0.393) + (g * 0.769) + (b * 0.189) + 20;
                data[i+1]   = (r * 0.349) + (g * 0.686) + (b * 0.168);
                data[i+2]   = (r * 0.272) + (g * 0.534) + (b * 0.131);
            }
            ctx.putImageData(imageData, 0, 0);

            // Retro narandžasti datum (minimalistički font u donjem uglu)
            const d = new Date();
            const dateStr = `'${String(d.getFullYear()).slice(-2)} ${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getDate()).padStart(2,'0')}`;
            ctx.font = "500 20px 'Inter', monospace";
            ctx.fillStyle = "#ff8c00";
            ctx.shadowColor = "rgba(0,0,0,0.6)";
            ctx.shadowBlur = 4;
            ctx.fillText(dateStr, canvas.width - 130, canvas.height - 24);

            const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ base64: base64Image })
            }).then(() => {
                photosLeft--;
                localStorage.setItem('snap_me_photos', photosLeft);
                updateUI();
                if(photosLeft > 0) {
                    statusEl.innerText = "Saved to album";
                    snapBtn.disabled = false;
                    setTimeout(() => { statusEl.innerText = "Ready"; }, 2000);
                }
            }).catch(err => {
                statusEl.innerText = "Error. Try again.";
                snapBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
